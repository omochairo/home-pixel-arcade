<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>おうちの ミニゲーム</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    background: linear-gradient(180deg, #dff3ff 0%, #fff7db 100%);
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Yu Gothic UI", "Meiryo", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .lock-card {
    width: 100%;
    max-width: 380px;
    background: #ffffff;
    border: 5px solid #2b4c8c;
    border-radius: 28px;
    padding: 24px 20px;
    text-align: center;
    box-shadow: 0 10px 0 #1b3263, 0 18px 36px rgba(0,0,0,0.18);
  }
  .lock-icon {
    font-size: 46px;
    line-height: 1;
    margin-bottom: 8px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 22px;
    font-weight: 900;
    color: #203a72;
  }
  p {
    margin: 0 0 16px;
    font-size: 14px;
    font-weight: 700;
    color: #556078;
    line-height: 1.5;
  }
  .input-wrap {
    position: relative;
    margin-bottom: 12px;
  }
  .pw-input {
    width: 100%;
    padding: 14px 48px 14px 16px;
    font-size: 20px;
    font-weight: 800;
    border: 3px solid #96b4e8;
    border-radius: 16px;
    outline: none;
    text-align: center;
    color: #1f2d4d;
    background: #f5f9ff;
  }
  .pw-input:focus {
    border-color: #2b7cff;
    background: #ffffff;
  }
  .toggle-vis {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .remember-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 800;
    color: #3a4a6b;
    margin-bottom: 16px;
    cursor: pointer;
  }
  .remember-row input {
    width: 18px;
    height: 18px;
    accent-color: #1eb842;
  }
  .unlock-btn {
    width: 100%;
    padding: 14px 20px;
    border-radius: 999px;
    border: 4px solid #ffffff;
    background: linear-gradient(180deg, #4be358 0%, #16a82b 100%);
    color: #ffffff;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 6px 0 #0b6e19, 0 8px 16px rgba(0,0,0,0.2);
  }
  .unlock-btn:active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 #0b6e19;
  }
  .unlock-btn:disabled {
    opacity: 0.7;
    cursor: wait;
  }
  .err-msg {
    min-height: 22px;
    margin-top: 12px;
    font-size: 13px;
    font-weight: 800;
    color: #e03131;
  }
</style>
</head>
<body>
<div class="lock-card">
  <div class="lock-icon">🔒✨</div>
  <h1>おうちの ミニゲーム</h1>
  <p>あいことば を いれてね！</p>
  <form id="unlockForm" autocomplete="off">
    <div class="input-wrap">
      <input id="pwInput" class="pw-input" type="text" placeholder="あいことば" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <button type="button" class="toggle-vis" id="toggleVis" aria-label="ひょうじきりかえ">👁️</button>
    </div>
    <label class="remember-row">
      <input type="checkbox" id="rememberChk" checked>
      <span>この スマホで おぼえておく</span>
    </label>
    <button type="submit" class="unlock-btn" id="unlockBtn">あそぶ！</button>
    <div class="err-msg" id="errMsg"></div>
  </form>
</div>

  const STORAGE_KEY = 'home_arcade_key_v1';

  const form = document.getElementById('unlockForm');
  const pwInput = document.getElementById('pwInput');
  const toggleVis = document.getElementById('toggleVis');
  const rememberChk = document.getElementById('rememberChk');
  const unlockBtn = document.getElementById('unlockBtn');
  const errMsg = document.getElementById('errMsg');

  let hidden = false;
  toggleVis.addEventListener('click', () => {
    hidden = !hidden;
    pwInput.type = hidden ? 'password' : 'text';
    toggleVis.textContent = hidden ? '🙈' : '👁️';
  });

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function tryUnlock(password, saveIfOk) {
    if (!window.crypto || !window.crypto.subtle) {
      throw new Error('NO_SUBTLE');
    }
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw',
      enc.encode(password),
      'PBKDF2',
      false,
      ['deriveKey']
    );
    const aesKey = await crypto.subtle.deriveKey(
      {
        name: 'PBKDF2',
        salt: b64ToBytes(PAYLOAD.s),
        iterations: PAYLOAD.n,
        hash: 'SHA-256'
      },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    const plainBuf = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64ToBytes(PAYLOAD.i) },
      aesKey,
      b64ToBytes(PAYLOAD.d)
    );
    const html = new TextDecoder().decode(plainBuf);
    if (saveIfOk) {
      try { localStorage.setItem(STORAGE_KEY, password); } catch (_) {}
    } else {
      try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
    }
    document.open();
    document.write(html);
    document.close();
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = pwInput.value.trim();
    if (!pw) return;
    errMsg.textContent = '';
    unlockBtn.disabled = true;
    unlockBtn.textContent = 'ひらいています...';
    try {
      await tryUnlock(pw, rememberChk.checked);
    } catch (err) {
      unlockBtn.disabled = false;
      unlockBtn.textContent = 'あそぶ！';
      if (err && err.message === 'NO_SUBTLE') {
        errMsg.textContent = 'HTTPSの ページから ひらいてね！';
      } else {
        errMsg.textContent = 'あれ？ あいことば が ちがうみたい';
      }
    }
  });

  // 記憶されたあいことばがあれば自動解除を試す
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      pwInput.value = saved;
      unlockBtn.disabled = true;
      unlockBtn.textContent = 'よみこみちゅう...';
      tryUnlock(saved, true).catch(() => {
        localStorage.removeItem(STORAGE_KEY);
        pwInput.value = '';
        unlockBtn.disabled = false;
        unlockBtn.textContent = 'あそぶ！';
      });
    }
  } catch (_) {}
})();
</script>
</body>
</html>
